services:
  grafana:
    image: grafana/grafana-oss:12.0.0
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL: frser-sqlite-datasource@4.0.6
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/raw-overview.json
    volumes:
      - ../data:/data
      - ./storage:/var/lib/grafana
      - ./dashboards:/var/lib/grafana/dashboards
      - ./provisioning:/etc/grafana/provisioning
