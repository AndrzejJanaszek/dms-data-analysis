[project]
name = "dms-analysis"
version = "0.1.0"
description = "Offline analysis of dosing monitoring plant data"
authors = [
    { name = "Andrzej Janaszek", email = "janaszek.andrzej.szkola@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anywidget>=0.11.0",
    "ipywidgets>=8.1.9",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=6.9.0",
    "plotly-resampler>=0.11.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
]
